<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>QA-GAS IoT Gateway – Video</title>
<style>
:root{--bg:#060e1a;--panel:#0c1a2e;--line:#1d3350;--cyan:#22d3ee;--green:#34d399;--amber:#fbbf24;--red:#f87171;--text:#e8f1ff;--muted:#8fa7c6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
canvas#bg{position:absolute;inset:0}
.scene{position:absolute;inset:0;opacity:0;display:none}
.a{position:absolute;will-change:transform,opacity}
.ov{font-size:22px;letter-spacing:.3em;font-weight:700;color:var(--cyan);text-transform:uppercase}
.h2{font-size:62px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.muted{color:var(--muted)}
.grad{background:linear-gradient(90deg,var(--cyan),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{display:inline-flex;align-items:center;gap:10px;padding:10px 20px;border:1.5px solid rgba(34,211,238,.45);border-radius:999px;font-size:24px;font-weight:600;color:#cfefff;background:rgba(34,211,238,.08);margin:0 10px 12px 0}
.cardbox{background:linear-gradient(160deg,rgba(18,36,62,.92),rgba(9,20,36,.92));border:1.5px solid var(--line);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%}
/* S1 */
#h1a{top:360px;left:0;width:1920px;text-align:center;font-size:62px;font-weight:600}
#h1b{top:450px;left:0;width:1920px;text-align:center;font-size:96px;font-weight:800;color:var(--amber);letter-spacing:-.02em}
#s1tag{top:360px;left:0;width:1920px;text-align:center}
#s1words{top:430px;left:0;width:1920px;text-align:center;font-size:118px;font-weight:800;letter-spacing:-.03em}
#s1words span{display:inline-block;margin:0 28px}
/* S2 */
#s2photo{left:0;top:0;width:900px;height:1080px;overflow:hidden}
#s2photo img{position:absolute;left:0;top:0;width:1500px;height:2000px;transform-origin:0 0}
#s2photo:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,14,26,0) 55%,var(--bg) 100%),linear-gradient(0deg,rgba(6,14,26,.5),rgba(6,14,26,0) 30%)}
/* S3 */
#tourImg{position:absolute;left:0;top:0;width:1500px;height:2000px;transform-origin:0 0}
#tourSpot{position:absolute;inset:0}
#tourFade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,14,26,0) 50%,rgba(6,14,26,.88) 60%,var(--bg) 70%),linear-gradient(180deg,rgba(6,14,26,.75),rgba(6,14,26,0) 18%)}
.ring{position:absolute;border-radius:50%;border:3px solid var(--cyan);box-shadow:0 0 28px rgba(34,211,238,.7),inset 0 0 22px rgba(34,211,238,.35)}
.ring:after{content:'';position:absolute;inset:-14px;border-radius:50%;border:1.5px dashed rgba(34,211,238,.6)}
.tcard{left:1220px;top:290px;width:620px}
.tcard .idx{font-family:'DejaVu Sans Mono',monospace;font-size:24px;color:var(--cyan);letter-spacing:.1em;margin-bottom:18px}
.tcard .tt{font-size:58px;font-weight:800;line-height:1.08;letter-spacing:-.02em;margin-bottom:24px}
.tcard .dd{font-size:29px;line-height:1.45;color:#b7c9e2;margin-bottom:28px}
#tourDots{left:1220px;top:860px}
#tourDots i{display:inline-block;width:12px;height:12px;border-radius:6px;background:#2a4565;margin-right:10px}
/* S4 */
.tile{width:400px;height:250px;padding:34px 34px}
.tile .tl{font-size:36px;font-weight:800;margin-top:22px}
.tile .ts{font-size:24px;color:var(--muted);margin-top:8px}
/* S5 */
.meter{width:320px;height:160px;padding:18px 20px}
.lcd{background:#0b2a22;border:1.5px solid #1f5a49;border-radius:10px;padding:10px 14px;font-family:'DejaVu Sans Mono',monospace;color:#7dffc8;font-size:22px;line-height:1.35;margin-top:10px}
.pill{padding:8px 18px;border-radius:999px;font-size:20px;font-weight:700;white-space:nowrap}
.kpi{width:228px;height:128px;padding:16px 18px;background:rgba(255,255,255,.03);border:1.5px solid var(--line);border-radius:16px}
.kpi .kl{font-size:19px;color:var(--muted)}
.kpi .kv{font-size:40px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .ku{font-size:20px;color:var(--muted);font-weight:600;margin-left:6px}
/* S6 */
.mach{width:450px;height:270px;padding:24px 26px}
.mach .mn{font-size:30px;font-weight:800}
.mach .ms{font-size:20px;color:var(--muted);margin-top:2px}
.stat{white-space:nowrap;display:inline-flex;align-items:center;gap:10px;font-size:21px;font-weight:700;padding:7px 16px;border-radius:999px}
.mach .row{display:flex;justify-content:space-between;margin-top:20px}
.mach .lb{font-size:19px;color:var(--muted)}
.mach .vl{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums}
.toggle{width:84px;height:44px;border-radius:22px;background:#24364f;position:relative}
.toggle i{position:absolute;top:5px;left:5px;width:34px;height:34px;border-radius:50%;background:#cfd8e6}
/* S7 */
.pcard{width:340px;height:560px;border-radius:22px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.08)}
.pcard img{width:100%;height:100%;object-fit:cover}
.bul{display:flex;align-items:center;gap:18px;font-size:31px;margin-bottom:26px;color:#d4e3f7}
/* S8 */
#s8bg{left:-40px;top:-60px;width:2000px;height:1200px;object-fit:cover}
.pillar{width:440px;text-align:center}
.pillar .pi{width:110px;height:110px;margin:0 auto 22px;border-radius:30px;display:flex;align-items:center;justify-content:center;background:rgba(34,211,238,.1);border:1.5px solid rgba(34,211,238,.4)}
.pillar .pt{font-size:36px;font-weight:800}
.pillar .ps{font-size:24px;color:var(--muted);margin-top:8px}
/* logo */
.logo{background:#fff;border-radius:22px;display:inline-block;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.logo img{display:block}
#wm{right:36px;top:30px;padding:6px 8px;border-radius:14px}
#black{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <section class="scene" id="s1"></section>
  <section class="scene" id="s2"></section>
  <section class="scene" id="s3"></section>
  <section class="scene" id="s4"></section>
  <section class="scene" id="s5"></section>
  <section class="scene" id="s6"></section>
  <section class="scene" id="s7"></section>
  <section class="scene" id="s8"></section>
  <div class="a logo" id="wm"><img src="assets/logo_qa.png" style="height:66px"></div>
  <div id="black"></div>
</div>
<script src="timing.js"></script>
<script>
// ===================== helpers =====================
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,p)=>a+(b-a)*p;
const eo=p=>1-Math.pow(1-p,3);
const eob=p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
const eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const prog=(t,s,d)=>clamp((t-s)/d);
function st(el,o,x=0,y=0,s=1,r=0){el.style.opacity=o.toFixed(3);el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${s.toFixed(4)}) rotate(${r}deg)`}
// enter at a (fade+slide), optional exit at out
function up(el,t,a,o={}){const d=o.d??.7,dy=o.dy??36,dx=o.dx??0,s0=o.s0??1,out=o.out??1e9,od=o.od??.4,oy=o.oy??-24,ease=o.ease??eo;
  const pi=ease(prog(t,a,d)),po=eio(prog(t,out,od));st(el,clamp(prog(t,a,d)*1.4)*(1-po),dx*(1-pi),dy*(1-pi)+oy*po,lerp(s0,1,pi),o.r??0)}
function cam(el,fx,fy,s,cx,cy){el.style.transform=`translate(${(cx-fx*s).toFixed(1)}px,${(cy-fy*s).toFixed(1)}px) scale(${s.toFixed(4)})`}
const fmt=(v,d=1)=>v.toLocaleString('vi-VN',{minimumFractionDigits:d,maximumFractionDigits:d});
function add(parent,html){parent.insertAdjacentHTML('beforeend',html);return parent.lastElementChild}
const IC={
chip:'<rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M9.5 3v4M14.5 3v4M9.5 17v4M14.5 17v4M3 9.5h4M3 14.5h4M17 9.5h4M17 14.5h4"/>',
wifi:'<path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1"/>',
lan:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 19v-5h8v5M7 9h10"/>',
bus:'<path d="M2 12h20"/><rect x="4" y="4" width="4" height="4" rx="1"/><rect x="10" y="4" width="4" height="4" rx="1"/><rect x="16" y="4" width="4" height="4" rx="1"/><path d="M6 8v4M12 8v4M18 8v4M12 12v6"/><circle cx="12" cy="19" r="1.5"/>',
input:'<path d="M2 12h11M9 8l4 4-4 4"/><rect x="15" y="4" width="6" height="16" rx="1.5"/>',
relay:'<path d="M3 17h4M17 17h4M8.5 17l7-6"/><circle cx="8" cy="17" r="1.6"/><circle cx="16" cy="17" r="1.6"/><path d="M12 3v5M10 5h4"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
sd:'<path d="M7 3h8l4 4v14H7z"/><path d="M10 3v4M13 3v4M16 5v2"/>',
din:'<rect x="6" y="3" width="12" height="18" rx="2"/><path d="M2 12h4M18 12h4M9 7h6"/>',
bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
monitor:'<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4M6 12l3-3 3 2 5-5"/>',
bell:'<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
cloud:'<path d="M7 18a5 5 0 0 1-.6-9.96A6.5 6.5 0 0 1 18.5 9.5 4.3 4.3 0 0 1 17.5 18z"/>',
leaf:'<path d="M5 20c0-10 6-15 15-15 0 9-5.5 15-14 15"/><path d="M5 20 13 12"/>',
gauge:'<path d="M3.5 17a8.5 8.5 0 1 1 17 0"/><path d="M12 17l4.5-5.5"/><circle cx="12" cy="17" r="1.3"/>',
meter:'<rect x="4" y="3" width="16" height="18" rx="2"/><rect x="7" y="6" width="10" height="5" rx="1"/><path d="M8 15h2M14 15h2M8 18h8"/>',
factory:'<path d="M3 21V10l5 3v-3l5 3v-3l5 3V4h3v17z"/><path d="M7 17h2M12 17h2"/>',
shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="M9 12l2 2 4-4"/>',
tool:'<path d="M14.5 6.5a4 4 0 0 0 5 5L12 19a2.1 2.1 0 0 1-3-3z"/><path d="M14.5 6.5 17 4l3 3-2.5 2.5"/>',
count:'<path d="M4 6h16M4 12h10M4 18h6"/><path d="M17 15v6M14 18h6"/>',
usb:'<rect x="5" y="8" width="14" height="8" rx="4"/><path d="M9 12h6"/>',
signal:'<path d="M5 20v-3M9.5 20v-6M14 20v-9M18.5 20V5"/>'
};
const icon=(n,sz=48,c='currentColor',w=1.7)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;

// ===================== timeline =====================
// timing.js (generated by build_voice.py) can override scene/tour durations to fit the voiceover
const TM=window.TIMING||{scenes:{s1:[0,6.2],s2:[5.8,12.3],s3:[11.9,35.3],s4:[34.9,41.3],s5:[40.9,55.3],s6:[54.9,68.3],s7:[67.9,75.3],s8:[74.9,82]},tour:[2.6,2.55,2.55,2.55,2.55,2.55,2.55,2.55,2.55],duration:82};
const SCENES=Object.entries(TM.scenes).map(([k,[a,b]])=>[k,a,b]);
window.DURATION=TM.duration;
const UPD={};

// ===================== background canvas =====================
const cv=$('bg'),cx=cv.getContext('2d');
const PARTS=[...Array(60)].map((_,i)=>({x:(i*397.3)%1920,y:(i*613.7)%1080,v:8+(i*7)%23,r:1+(i%3)*.7,ph:i*1.7}));
function drawBg(t){
  cx.fillStyle='#060e1a';cx.fillRect(0,0,1920,1080);
  const g1=cx.createRadialGradient(400+200*Math.sin(t*.13),300+120*Math.cos(t*.11),0,400,300,900);
  g1.addColorStop(0,'rgba(34,211,238,0.13)');g1.addColorStop(1,'rgba(34,211,238,0)');cx.fillStyle=g1;cx.fillRect(0,0,1920,1080);
  const g2=cx.createRadialGradient(1550+150*Math.cos(t*.09),850+100*Math.sin(t*.15),0,1550,850,900);
  g2.addColorStop(0,'rgba(52,211,153,0.10)');g2.addColorStop(1,'rgba(52,211,153,0)');cx.fillStyle=g2;cx.fillRect(0,0,1920,1080);
  cx.strokeStyle='rgba(120,170,230,0.06)';cx.lineWidth=1;const off=(t*12)%60;
  cx.beginPath();for(let x=-60+off;x<1920;x+=60){cx.moveTo(x,0);cx.lineTo(x,1080)}for(let y=-60+off;y<1080;y+=60){cx.moveTo(0,y);cx.lineTo(1920,y)}cx.stroke();
  for(const p of PARTS){const y=(p.y-t*p.v+1080*10)%1080;const a=.25+.25*Math.sin(t*1.3+p.ph);cx.fillStyle=`rgba(140,220,255,${a})`;cx.beginPath();cx.arc(p.x,y,p.r,0,7);cx.fill()}
  // intro waveform
  if(t<6.4){const a=clamp(t/1)*(1-clamp((t-5.6)/.6));
    for(let k=0;k<3;k++){cx.beginPath();const col=['34,211,238','52,211,153','251,191,36'][k];
      cx.strokeStyle=`rgba(${col},${.55*a})`;cx.lineWidth=2.5;cx.shadowColor=`rgba(${col},.8)`;cx.shadowBlur=14;
      const drawTo=1920*eo(clamp(t/2.2));
      for(let x=0;x<=drawTo;x+=6){const y=800+60*Math.sin(x/1920*Math.PI*6+t*2.4+k*2.094)*Math.sin(Math.PI*x/1920);x?cx.lineTo(x,y):cx.moveTo(x,y)}cx.stroke()}
    cx.shadowBlur=0}
}

// ===================== S1 intro =====================
(()=>{const s=$('s1');
 const a=add(s,'<div class="a" id="h1a">Nhà máy của bạn đang tiêu thụ</div>');
 const b=add(s,'<div class="a" id="h1b">bao nhiêu điện — ngay lúc này?</div>');
 const lg=add(s,'<div class="a logo" style="left:870px;top:120px;padding:10px 12px"><img src="assets/logo_qa.png" style="height:180px"></div>');
 const tag=add(s,'<div class="a ov" id="s1tag">Giải pháp IoT cho nhà máy thông minh</div>');
 const w=add(s,'<div class="a" id="s1words"><span style="color:var(--cyan)">Đo lường.</span><span style="color:var(--green)">Giám sát.</span><span style="color:var(--amber)">Điều khiển.</span></div>');
 w.style.opacity=1;const ws=[...w.children];
 UPD.s1=t=>{up(lg,t,3.25,{dy:-30,s0:.7,ease:eob});up(a,t,.3,{out:2.9});up(b,t,.9,{s0:.94,out:3.0});up(tag,t,3.5,{dy:20});ws.forEach((e,i)=>up(e,t,3.6+i*.35,{dy:60,s0:.8,ease:eob}))};
})();

// ===================== S2 reveal =====================
(()=>{const s=$('s2');
 const ph=add(s,'<div class="a" id="s2photo"><img src="assets/side_view.jpg"></div>');const img=ph.querySelector('img');
 const o=add(s,'<div class="a ov" style="left:980px;top:250px">QA-GAS &nbsp;·&nbsp; Industrial IoT</div>');
 const h=add(s,'<div class="a" style="left:975px;top:300px;font-size:116px;font-weight:800;letter-spacing:-.035em;line-height:1">IoT Gateway</div>');
 const h2=add(s,'<div class="a grad" style="left:978px;top:420px;font-size:116px;font-weight:800;letter-spacing:-.035em;line-height:1.05">ESP32-S3</div>');
 const p=add(s,'<div class="a muted" style="left:982px;top:575px;width:820px;font-size:34px;line-height:1.4">Bộ thu thập dữ liệu &amp; điều khiển công nghiệp — đưa mọi thiết bị trong nhà máy lên Cloud.</div>');
 const chips=add(s,'<div class="a" style="left:982px;top:730px;width:880px"></div>');chips.style.opacity=1;
 ['WiFi + BLE','Ethernet','RS485 Modbus','4 DI','4 Relay','RTC','MicroSD'].forEach(c=>add(chips,`<span class="chip">${c}</span>`));
 const cs=[...chips.children];
 UPD.s2=t=>{st(ph,clamp(t/.8),lerp(-60,0,eo(clamp(t/1.2))));cam(img,790,1000,lerp(.86,.97,t/6.5),450,560);
  up(o,t,.4,{dx:-30,dy:0});up(h,t,.6,{dy:50});up(h2,t,.85,{dy:50});up(p,t,1.3);cs.forEach((c,i)=>up(c,t,1.9+i*.12,{dy:20,s0:.85}))};
})();

// ===================== S3 hardware tour =====================
const STOPS=[
 {f:[790,1180],s:.8,rings:[],i:'Tổng quan',t:'Một bo mạch,<br>đủ mọi kết nối',d:'Thiết kế gọn trong vỏ DIN-rail, tích hợp sẵn mọi cổng cần thiết để thu thập dữ liệu &amp; điều khiển tại hiện trường.',tg:['All-in-one','Lắp tủ điện']},
 {f:[600,1050],s:2.0,rings:[[640,1135,150],[420,862,55]],t:'ESP32-S3 +<br>Anten ngoài',d:'Vi xử lý lõi kép 240 MHz, WiFi 2.4 GHz &amp; Bluetooth LE. Anten SMA rời giúp sóng ổn định cả trong tủ điện kim loại.',tg:['WiFi','BLE','Dual-core']},
 {f:[800,960],s:2.4,rings:[[795,940,140]],t:'Cổng Ethernet<br>RJ45',d:'Kết nối mạng LAN có dây — ổn định, ít nhiễu, phù hợp hạ tầng mạng của nhà máy.',tg:['LAN','Có dây']},
 {f:[520,1590],s:2.4,rings:[[570,1612,105]],t:'RS485 –<br>Modbus RTU',d:'Đấu nối đồng hồ điện đa năng, biến tần, PLC, cảm biến… nhiều thiết bị trên cùng một bus, khoảng cách tới 1.200 m.',tg:['A+ / B- / G','Multi-drop']},
 {f:[990,860],s:2.2,rings:[[992,830,190]],t:'4 ngõ vào số<br>cách ly quang',d:'IN1–IN4 + COM: đọc trạng thái chạy/dừng của máy, đếm sản phẩm, tín hiệu cảm biến, nút nhấn.',tg:['IN1–IN4','Opto']},
 {f:[860,1530],s:1.55,rings:[[862,1470,270]],t:'4 Relay 10A<br>có chống xung',d:'Relay HF32F 10A/250VAC kèm varistor bảo vệ — bật/tắt tải, còi đèn báo, contactor từ xa.',tg:['10A 250VAC','Varistor']},
 {f:[1130,1430],s:2.0,rings:[[1150,1250,110],[1120,1612,110]],t:'RTC &amp;<br>thẻ MicroSD',d:'Đồng hồ thời gian thực dùng pin CR1220, lưu dữ liệu vào thẻ nhớ — không mất dữ liệu khi rớt mạng.',tg:['Timestamp','Data logging']},
 {f:[470,1480],s:1.9,rings:[[382,1402,85],[455,1612,85]],t:'Nguồn DC<br>công nghiệp &amp; USB-C',d:'Ngõ vào VIN với mạch lọc nguồn, tụ 470 µF/35 V. Cổng USB-C để nạp firmware &amp; cấu hình nhanh.',tg:['VIN DC','USB-C']},
 {f:[1080,930],s:2.2,rings:[[1150,920,85]],t:'Sẵn sàng<br>mở rộng 4G LTE',d:'Vị trí mở rộng module LTE cho công trình không có Internet cố định hoặc cần đường truyền dự phòng.',tg:['LTE','Dự phòng']}
];
const TR=.85,CX=600,CY=560;
const SS=i=>TM.tour.slice(0,i).reduce((a,b)=>a+b,0); // start time of tour stop i
(()=>{const s=$('s3');
 const img=add(s,'<img id="tourImg" src="assets/board_top.jpg">');

window.render=t=>{

  for(const [id,a,b] of SCENES){const el=$(id);

    el.style.display='block';
