<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Cấp phát nhiên liệu nội bộ – Video</title>
<style>
:root{--bg:#06111f;--panel:#0c1b2f;--line:#1f3756;--blue:#1e88e5;--cyan:#38bdf8;--green:#4ade80;--pink:#f472b6;--amber:#fbbf24;--red:#f87171;--text:#eaf2ff;--muted:#93a9c6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
canvas#bg{position:absolute;inset:0}
.scene{position:absolute;inset:0;opacity:0;display:none}
.a{position:absolute;will-change:transform,opacity;opacity:0}
.cam{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none}
.ov{font-size:22px;letter-spacing:.28em;font-weight:700;color:var(--cyan);text-transform:uppercase}
.muted{color:var(--muted)}
.grad{background:linear-gradient(90deg,var(--cyan),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{display:inline-flex;align-items:center;gap:10px;padding:10px 20px;border:1.5px solid rgba(56,189,248,.45);border-radius:999px;font-size:24px;font-weight:600;color:#d3efff;background:rgba(56,189,248,.08);margin:0 10px 12px 0}
.card{background:linear-gradient(160deg,rgba(19,38,64,.94),rgba(9,21,38,.94));border:1.5px solid var(--line);border-radius:24px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.photo{overflow:hidden;border-radius:26px;border:2px solid rgba(255,255,255,.1);box-shadow:0 30px 80px rgba(0,0,0,.6);background:#0a1626}
.center{left:0;width:1920px;text-align:center}
/* phone */
.phone{width:432px;height:836px;padding:14px;border-radius:58px;background:linear-gradient(145deg,#1c2634,#05080d);border:2px solid #34445a;box-shadow:0 40px 90px rgba(0,0,0,.65),inset 0 0 0 2px #0b1018}
.phone .scr{position:relative;width:400px;height:804px;border-radius:44px;overflow:hidden;background:#f3f6fa}
.phone .scr img{position:absolute;left:0;top:0;width:400px}
.phone .scr .notch{position:absolute;left:150px;top:10px;width:100px;height:28px;border-radius:14px;background:#05080d;z-index:3}
.hl{position:absolute;border:4px solid var(--amber);border-radius:18px;box-shadow:0 0 0 2000px rgba(5,10,20,.35),0 0 26px rgba(251,191,36,.8);opacity:0;z-index:2}
/* rail */
#rail{left:360px;top:42px;width:1200px;height:120px}
#rail .ln{position:absolute;left:100px;top:27px;width:1000px;height:4px;border-radius:2px;background:#1f3756}
#rail .ln i{display:block;height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--green))}
#rail .nd{position:absolute;top:0;width:200px;text-align:center}
#rail .nd b{display:flex;margin:0 auto;width:58px;height:58px;border-radius:50%;align-items:center;justify-content:center;font-size:26px;font-weight:800;background:#0c1b2f;border:3px solid #2a4568;color:#7f98b8}
#rail .nd span{display:block;margin-top:10px;font-size:22px;font-weight:600;color:#7f98b8}
#rail .nd.on b{background:linear-gradient(135deg,#0ea5e9,#22c55e);border-color:transparent;color:#fff;box-shadow:0 0 24px rgba(56,189,248,.7)}
#rail .nd.on span{color:#fff}
#rail .nd.done b{border-color:var(--green);color:var(--green)}
/* step card */
.step{left:1010px;top:250px;width:800px}
.step .n{font-size:24px;font-weight:800;letter-spacing:.25em;color:var(--cyan)}
.step .t{font-size:68px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:14px 0 30px}
.bul{display:flex;align-items:flex-start;gap:18px;font-size:31px;line-height:1.3;margin-bottom:22px;color:#d6e4f7}
.bul svg{flex:none;margin-top:2px}
.kpi{margin-top:30px;padding:24px 30px}
.kpi .l{font-size:21px;color:var(--muted)}
.kpi .v{font-size:52px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:26px}
.tgrid div{padding:18px 24px;border-radius:18px;background:rgba(30,136,229,.14);border:1.5px solid rgba(56,189,248,.35)}
.tgrid small{display:block;font-size:20px;color:var(--muted)}
.tgrid b{display:block;font-size:34px;font-weight:800;margin-top:4px}
/* HMI */
#hmi{left:930px;top:225px;width:880px;height:528px;border-radius:20px;background:#1b1f25;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.6);border:3px solid #9aa4b1}
#hmi .sc{width:100%;height:100%;border-radius:6px;overflow:hidden;background:#dfe9f5;position:relative;font-family:'Inter',sans-serif;color:#0f2a4a}
#hmi .hd{height:52px;background:linear-gradient(90deg,#0d5bb5,#1976d2);color:#fff;display:flex;align-items:center;padding:0 20px;font-size:22px;font-weight:700;gap:14px}
#hmi .hd .qa{font-style:italic;font-weight:900;color:#a7f3d0}
#hmi .hd .on{margin-left:auto;font-size:19px;font-weight:600}
#hmi .hd .on i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#4ade80;margin-right:8px}
#hmi .lp{position:absolute;left:14px;top:66px;width:600px;height:384px;background:#fff;border-radius:10px;border:1.5px solid #c5d4e6}
#hmi .lb{font-size:17px;font-weight:700;color:#3b5578;letter-spacing:.04em}
#hmi .lb small{font-weight:500;color:#8aa0bc;margin-left:8px}
#hmi .dg{font-variant-numeric:tabular-nums;font-weight:800;text-align:right;letter-spacing:.02em;line-height:1}
#hmi .rp{position:absolute;left:628px;top:66px;width:186px}
#hmi .btn{height:150px;border-radius:12px;background:linear-gradient(160deg,#1e88e5,#0d5bb5);color:#fff;text-align:center;padding-top:18px}
#hmi .btn b{display:block;font-size:26px;font-weight:900;margin-top:8px}
#hmi .btn small{font-size:14px;opacity:.85}
#hmi .bx{margin-top:12px;background:#fff;border-radius:10px;border:1.5px solid #c5d4e6;padding:10px 14px}
#hmi .bx .lb{font-size:14px}
#hmi .bx .v{font-size:24px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
#flow{left:930px;top:790px;width:880px}
#flow .bar{height:22px;border-radius:11px;background:#14283f;overflow:hidden;border:1.5px solid #24456b}
#flow .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0ea5e9,#22c55e)}
/* receipt */
#rcpt{left:1000px;top:205px;width:430px;height:0;overflow:hidden;filter:drop-shadow(0 20px 40px rgba(0,0,0,.6))}
#rcpt .pp{width:430px;background:#fbfbf7;color:#1b1b1b;font-family:'DejaVu Sans Mono',monospace;font-size:19px;line-height:1.55;padding:26px 28px 34px}
#rcpt .pp .c{text-align:center;font-weight:700}
#rcpt .pp hr{border:none;border-top:2px dashed #888;margin:10px 0}
#rcpt .pp .r{display:flex;justify-content:space-between}
#slot{left:985px;top:190px;width:460px;height:22px;border-radius:11px;background:#0a0f16;border:2px solid #3a4b61}
/* tour */
#tourImg,#tourImg2{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none}
#tourFade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,17,31,0) 0%,rgba(6,17,31,0) 52%,rgba(6,17,31,.88) 64%,rgba(6,17,31,.97) 100%)}
.ring{position:absolute;border-radius:50%;border:4px solid var(--cyan);box-shadow:0 0 30px rgba(56,189,248,.7),inset 0 0 30px rgba(56,189,248,.35);opacity:0}
.tcard{left:1230px;top:200px;width:610px;padding:44px 46px}
.tcard .idx{font-size:21px;font-weight:700;letter-spacing:.24em;color:var(--cyan)}
.tcard .ic{width:86px;height:86px;border-radius:24px;display:flex;align-items:center;justify-content:center;background:rgba(56,189,248,.12);border:1.5px solid rgba(56,189,248,.4);margin:22px 0}
.tcard .tt{font-size:54px;font-weight:800;letter-spacing:-.02em;line-height:1.08}
.tcard .dd{font-size:28px;line-height:1.45;color:#c6d6ec;margin:22px 0 26px}
.pin{display:flex;align-items:center;gap:12px;padding:10px 18px;border-radius:14px;background:rgba(6,17,31,.88);border:1.5px solid var(--cyan);font-size:23px;font-weight:700;white-space:nowrap}
.pin i{width:14px;height:14px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
/* specs */
.kt{width:320px;height:178px;padding:24px 26px;border-color:rgba(74,222,128,.45)}
.kt small{display:flex;align-items:center;gap:10px;font-size:20px;color:var(--muted);font-weight:600}
.kt b{display:block;font-size:40px;font-weight:900;letter-spacing:.01em;margin-top:16px;line-height:1.05}
.kt span{display:block;font-size:19px;color:var(--muted);margin-top:8px}
.sr{width:490px;height:76px;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1.5px solid #1f3756}
.sr .l{font-size:22px;color:var(--muted);width:150px;flex:none}
.sr .v{font-size:25px;font-weight:700}
/* features */
.feat{width:400px;height:178px;padding:24px 26px;display:flex;gap:20px}
.feat .fi{flex:none;width:68px;height:68px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:rgba(56,189,248,.12);border:1.5px solid rgba(56,189,248,.4)}
.feat b{display:block;font-size:27px;line-height:1.15}
.feat span{display:block;font-size:20px;line-height:1.35;color:var(--muted);margin-top:8px}
/* workshop */
.wk{width:500px;height:640px}
.wk img{width:100%;height:100%;object-fit:cover}
.wk .cap{position:absolute;left:0;right:0;bottom:0;padding:70px 28px 24px;background:linear-gradient(transparent,rgba(4,10,20,.92));font-size:30px;font-weight:800}
.wk .cap small{display:block;font-size:20px;letter-spacing:.2em;color:var(--cyan);margin-bottom:6px}
/* end */
.pillar{width:460px;text-align:center}
.pillar .pi{width:130px;height:130px;margin:0 auto 26px;border-radius:36px;display:flex;align-items:center;justify-content:center;background:rgba(56,189,248,.1);border:1.5px solid rgba(56,189,248,.45)}
.pillar .pt{font-size:42px;font-weight:800;line-height:1.15}
.pillar .ps{font-size:25px;color:var(--muted);margin-top:10px}
.logo{background:#fff;border-radius:22px;display:inline-block;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.logo img{display:block}
#wm{right:34px;top:28px;padding:6px 8px;border-radius:14px}
#black{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.pain{width:470px;padding:40px 30px;text-align:center;border-color:rgba(248,113,113,.4)}
.pain .pi{position:relative;width:120px;height:120px;margin:0 auto 24px;border-radius:34px;display:flex;align-items:center;justify-content:center;background:rgba(248,113,113,.1);border:1.5px solid rgba(248,113,113,.45)}
.pain .x{position:absolute;right:-14px;top:-14px;width:46px;height:46px;border-radius:50%;background:#ef4444;display:flex;align-items:center;justify-content:center}
.pain b{font-size:38px;font-weight:800}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <section class="scene" id="s1"></section>
  <section class="scene" id="s2"></section>
  <section class="scene" id="s3"></section>
  <section class="scene" id="s4"></section>
  <section class="scene" id="s5"></section>
  <section class="scene" id="s5b"></section>
  <section class="scene" id="s6"></section>
  <section class="scene" id="s7"></section>
  <section class="scene" id="s8"></section>
  <div class="a" id="rail"></div>
  <div class="a logo" id="wm"><img src="assets/logo_qa.png" style="height:64px"></div>
  <div id="black"></div>
</div>
<script src="timing.js"></script>
<script>
// Contact line shown on the last screen (leave empty to hide), e.g. 'Hotline/Zalo: 09xx xxx xxx'
const CONTACT='';

// ===================== helpers =====================
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,p)=>a+(b-a)*p;
const eo=p=>1-Math.pow(1-p,3);
const eob=p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
const eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const prog=(t,s,d)=>clamp((t-s)/d);
function st(el,o,x=0,y=0,s=1,r=0){el.style.opacity=o.toFixed(3);el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${s.toFixed(4)}) rotate(${r.toFixed(2)}deg)`}
// fade/slide in at a, optional exit at out
function up(el,t,a,o={}){const d=o.d??.7,dy=o.dy??36,dx=o.dx??0,s0=o.s0??1,out=o.out??1e9,od=o.od??.4,oy=o.oy??-24,ox=o.ox??0,ease=o.ease??eo;
  const pi=ease(prog(t,a,d)),po=eio(prog(t,out,od));st(el,clamp(prog(t,a,d)*1.4)*(1-po),dx*(1-pi)+ox*po,dy*(1-pi)+oy*po,lerp(s0,1,pi),o.r??0)}
function cam(el,fx,fy,s,cx,cy){el.style.transform=`translate(${(cx-fx*s).toFixed(1)}px,${(cy-fy*s).toFixed(1)}px) scale(${s.toFixed(4)})`}
function camAt(keys,t){ // keys: [[time,fx,fy,s],...] eased between consecutive keys
  if(t<=keys[0][0])return keys[0].slice(1);
  for(let i=1;i<keys.length;i++){const[a,...A]=keys[i-1],[b,...B]=keys[i];if(t<b){const p=eio(clamp((t-a)/(b-a)));return A.map((v,k)=>lerp(v,B[k],p))}}
  return keys[keys.length-1].slice(1)}
const vn=(v,d=0)=>v.toLocaleString('vi-VN',{minimumFractionDigits:d,maximumFractionDigits:d});
function add(parent,html){parent.insertAdjacentHTML('beforeend',html);return parent.lastElementChild}
const IC={
fuel:'<path d="M3 22h12M4 9h10M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"/><path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 4 0V9.8a2 2 0 0 0-.6-1.4L18 5"/>',
drop:'<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>',
qr:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/>',
phone:'<rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/>',
check:'<path d="M20 6 9 17l-5-5"/>',
checkc:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
truck:'<path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
shield:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="M9 12l2 2 4-4"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
building:'<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1M10 21v-3h4v3"/>',
book:'<path d="M4 4h11a3 3 0 0 1 3 3v14H7a3 3 0 0 1-3-3z"/><path d="M8 8h6M8 12h6"/>',
x:'<path d="M18 6 6 18M6 6l12 12"/>',
cloud:'<path d="M7 18a5 5 0 0 1-.6-9.96A6.5 6.5 0 0 1 18.5 9.5 4.3 4.3 0 0 1 17.5 18z"/>',
printer:'<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/>',
screen:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
counter:'<rect x="3" y="7" width="18" height="10" rx="1.5"/><path d="M7.5 7v10M12 7v10M16.5 7v10"/>',
antenna:'<path d="M12 10v11M9 21h6"/><circle cx="12" cy="8" r="2"/><path d="M7.8 3.8a6 6 0 0 0 0 8.4M16.2 3.8a6 6 0 0 1 0 8.4"/>',
lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
receipt:'<path d="M5 3h14v18l-2.5-1.5L14 21l-2-1.5L10 21l-2.5-1.5L5 21z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
sync:'<path d="M21 12a9 9 0 0 1-15.5 6.2M3 12A9 9 0 0 1 18.5 5.8"/><path d="M21 4v5h-5M3 20v-5h5"/>',
tank:'<rect x="5" y="3" width="14" height="18" rx="3"/><path d="M5 13h14"/>',
gauge:'<path d="M3.5 17a8.5 8.5 0 1 1 17 0"/><path d="M12 17l4.5-5.5"/><circle cx="12" cy="17" r="1.3"/>',
chip:'<rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M9.5 3v4M14.5 3v4M9.5 17v4M14.5 17v4M3 9.5h4M3 14.5h4M17 9.5h4M17 14.5h4"/>',
tool:'<path d="M14.5 6.5a4 4 0 0 0 5 5L12 19a2.1 2.1 0 0 1-3-3z"/><path d="M14.5 6.5 17 4l3 3-2.5 2.5"/>',
eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
history:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>'
};
const icon=(n,sz=48,c='currentColor',w=1.8)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const phone=(imgs)=>`<div class="a phone"><div class="scr"><div class="notch"></div>${imgs.map(s=>`<img src="assets/${s}">`).join('')}</div></div>`;

// ===================== timeline =====================
const TM=window.TIMING;
const SCENES=Object.entries(TM.scenes).map(([k,[a,b]])=>[k,a,b]);
const C=TM.cues, LN=TM.lens;
window.DURATION=TM.duration;
const UPD={};

// ===================== background =====================
const cv=$('bg'),cx=cv.getContext('2d');
const PARTS=[...Array(60)].map((_,i)=>({x:(i*397.3)%1920,y:(i*613.7)%1080,v:8+(i*7)%23,r:1+(i%3)*.7,ph:i*1.7}));
function drawBg(t){
  cx.fillStyle='#06111f';cx.fillRect(0,0,1920,1080);
  const g1=cx.createRadialGradient(420+200*Math.sin(t*.13),300+120*Math.cos(t*.11),0,420,300,950);
  g1.addColorStop(0,'rgba(30,136,229,0.18)');g1.addColorStop(1,'rgba(30,136,229,0)');cx.fillStyle=g1;cx.fillRect(0,0,1920,1080);
  const g2=cx.createRadialGradient(1550+150*Math.cos(t*.09),850+100*Math.sin(t*.15),0,1550,850,900);
  g2.addColorStop(0,'rgba(74,222,128,0.09)');g2.addColorStop(1,'rgba(74,222,128,0)');cx.fillStyle=g2;cx.fillRect(0,0,1920,1080);
  cx.strokeStyle='rgba(120,170,230,0.055)';cx.lineWidth=1;const off=(t*12)%60;
  cx.beginPath();for(let x=-60+off;x<1920;x+=60){cx.moveTo(x,0);cx.lineTo(x,1080)}for(let y=-60+off;y<1080;y+=60){cx.moveTo(0,y);cx.lineTo(1920,y)}cx.stroke();
  for(const p of PARTS){const y=(p.y-t*p.v+1080*10)%1080;const a=.22+.22*Math.sin(t*1.3+p.ph);cx.fillStyle=`rgba(140,210,255,${a})`;cx.beginPath();cx.arc(p.x,y,p.r,0,7);cx.fill()}
  // intro: flowing fuel lines
  const e1=TM.scenes.s1[1];
  if(t<e1){const a=clamp(t/1)*(1-clamp((t-(e1-.8))/.8));
    for(let k=0;k<3;k++){cx.beginPath();const col=['56,189,248','251,191,36','74,222,128'][k];
      cx.strokeStyle=`rgba(${col},${.5*a})`;cx.lineWidth=2.5;cx.shadowColor=`rgba(${col},.8)`;cx.shadowBlur=14;
      const drawTo=1920*eo(clamp(t/2.4));

const RN=[...rail.querySelectorAll('.nd')],RL=rail.querySelector('.ln i');
function railActive(t){ // global time -> active step (0..4, fractional for the line)
  const s3=TM.scenes.s3[0],s4=TM.scenes.s4[0];
  const marks=[s3+C.s3[1]-.2,s3+C.s3[2]-.2,s3+C.s3[3]-.2,s4+C.s4[0]-.2];
  let k=-1;marks.forEach((m,i)=>{if(t>=m)k=i});return {k,marks}}
function drawRail(t){const a=TM.scenes.s3[0],b=TM.scenes.s4[1];
  if(t<a-.1||t>b){rail.style.opacity=0;return}
  st(rail,clamp((t-a-.3)/.6)*(1-clamp((t-(b-.6))/.5)),0,lerp(-30,0,eo(prog(t,a+.3,.7))));
  const {k,marks}=railActive(t);
  RN.forEach((n,i)=>{n.classList.toggle('on',i===k);n.classList.toggle('done',i<k)});
  const prev=k<=0?0:(k-1)/3,cur=k<0?0:k/3;
  RL.style.width=(lerp(prev,cur,eo(clamp((t-(marks[k]??0))/.7)))*100).toFixed(2)+'%';
}
